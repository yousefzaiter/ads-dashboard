[project]
name = "ads-dashboard"
version = "0.2.0"
description = "Multi-platform ads dashboard (Google Ads, Meta, Snap, TikTok) built on Streamlit"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = ["google ads", "meta ads", "snap ads", "tiktok ads", "streamlit", "dashboard", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]
# Runtime dependencies are managed in requirements.txt (used by Procfile).
# This list is the minimal set needed to import the MCP servers as a library.
dependencies = [
    "mcp[cli]>=1.3.0",
    "google-api-python-client>=2.163.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.1",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "bcrypt>=4.0.0",
]
